description: >-
  Plans and pricing record for the Administration for Native Americans (ANA). ANA
  is a U.S. federal program office. It publishes no API, sells no API access, and
  operates no commercial tiering of any kind. Its two dataset records on
  healthdata.gov are public-domain federal open data under ODbL 1.0, free to
  everyone, with no account, key, quota or price attached.
