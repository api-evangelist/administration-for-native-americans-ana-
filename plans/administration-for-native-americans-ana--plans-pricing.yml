free: true
notes:
  - >-
    ANA administers a discretionary grant program (SEDS, Native Language
    Preservation and Maintenance, Esther Martinez Immersion, Environmental
    Regulatory Enhancement) of roughly $45M annually. Those are grants ANA AWARDS
    to tribal and Native organizations, not plans a developer buys. They are
    deliberately excluded from this artifact: recording them as pricing tiers would
    misrepresent a federal funding program as an API commercial model.
  - >-
    Supersedes a scaffold written by the 2026-05-04 bulk sweep which invented
    Free / Professional / Enterprise tiers with placeholder quotas (1,000 and
    100,000 requests/month) and TBD prices. No such tiers exist and none were ever
    published by ANA. Replaced 2026-08-30 with the searched zero.
