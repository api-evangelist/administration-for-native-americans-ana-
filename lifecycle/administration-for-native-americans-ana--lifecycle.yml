findings:
  - >-
    ANA's flagship catalog record advertises exactly one distribution and that
    distribution 404s. This is the single most actionable defect on ANA's data
    surface and it is the provider's to fix: update the DCAT distribution
    downloadURL on healthdata.gov asset c57a-jjpd from /ana/research to a live
    ANA page.
  - >-
    Both ANA assets are declared assetType "href", so neither is queryable. The
    underlying content is a PDF report. There is no tabular ANA data in the federal
    inventory despite ANA administering a roughly $45M annual discretionary grant
    program with published project outcomes.
