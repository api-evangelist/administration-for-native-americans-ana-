description: >-
  Lifecycle record for the Administration for Native Americans (ANA) data surface.
  ANA ships no API, so there is no API versioning scheme, no deprecation policy
  and no status page. What can be measured is the currency of the two dataset
  records ANA has in the federal data inventory, and the liveness of the access
  points those records advertise. Both are stale and one of them is broken.
