description: >-
  Well-known URI probe record for the Administration for Native Americans (ANA).
  ANA is a program office inside the Administration for Children and Families
  (ACF), U.S. Department of Health and Human Services; its web presence is served
  by the ACF Drupal estate (acf.gov / www.acf.hhs.gov) and its two published
  dataset records live on the HHS-operated healthdata.gov Socrata platform and the
  data.gov catalog. Every RFC 8615 well-known path was probed on all four hosts and
  every one returned 404. No WellKnown or SecurityTxt pointer is emitted, because
  this file records an absence, not a served surface.
