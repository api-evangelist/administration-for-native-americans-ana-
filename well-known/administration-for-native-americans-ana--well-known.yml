notes:
  - >-
    The HHS department-level host www.hhs.gov answers 403 Access Denied to every
    request from a non-browser client, including /.well-known/security.txt, so the
    HHS-wide vulnerability disclosure policy could not be read from an ANA host.
    That host is not an ANA property and is recorded here only as context.
  - >-
    healthdata.gov and catalog.data.gov return a rendered HTML 404 page for these
    paths (Socrata and data.gov respectively). Neither is an SPA catch-all
    returning a false 200.
