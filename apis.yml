  - aid: administration-for-native-americans-ana-:ana-fy2013-congressional-report
    name: FY 2013 Congressional Report on the Social and Economic Conditions of Native Americans
    description: >-
      Metadata-only catalog record in the HHS enterprise data inventory for the
      FY 2013 Congressional Report on the Social and Economic Conditions of Native
      Americans, published by the Administration for Children and Families. Like
      the ANA Projects Report it is a Socrata href asset, not a queryable dataset:
      the record links to the full report on the official ACF site. Discovered
      2026-08-30 in https://healthdata.gov/data.json.
